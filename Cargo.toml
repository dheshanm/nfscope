[package]
name = "nfscope"
version = "0.1.2"
edition = "2024"
description = "Live top-like TUI for NFS server client I/O"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
color-eyre = "0.6.5"
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
dns-lookup = "4.0.2"
humansize = "2.1.3"
jiff = "1"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
throbber-widgets-tui = "0.11.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-logger = { version = "0.18.3", features = ["tracing-support"] }
tui-tree-widget = "0.24.1"

[dev-dependencies]
insta = "1.49.0"

[profile.release]
strip = true
lto = "thin"
