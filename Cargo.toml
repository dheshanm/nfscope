[package]
name = "nfscope"
version = "0.1.7"
edition = "2024"
description = "top for Linux NFS servers: per-client throughput, nfsd thread usage, in-flight requests and open files"
license = "Unlicense"
repository = "https://github.com/dheshanm/nfscope"
readme = "README.md"
keywords = ["nfs", "nfsd", "tui", "monitoring", "sysadmin"]
categories = ["command-line-utilities", "filesystem", "os::linux-apis"]
exclude = ["docs/*.png", "scratch/", "tests/fixtures/local/", ".claude/"]

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
color-eyre = "0.6.5"
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
dns-lookup = "4.0.2"
humansize = "2.1.3"
jiff = "1"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
throbber-widgets-tui = "0.11.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-logger = { version = "0.18.3", features = ["tracing-support"] }
tui-tree-widget = "0.24.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
netlink-packet-core = "0.9"
netlink-packet-sock-diag = { version = "0.5", features = ["rich_nlas"] }
netlink-sys = "0.9"

[dev-dependencies]
insta = "1.49.0"

[profile.release]
strip = true
lto = "thin"
